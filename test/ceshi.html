<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>

  <body>
    <script src="./lib/index.umd.js"></script>
    <script type="module">
      import info from './info.js'

      const distObj$sort = butils.arrayToObj(info.distict, 'sort')
      const dictList = info.distict.map(v => {
        if (v.sort?.length === 2) {
          // 当是省级
          v._parentId = null
        } else {
          let tmpPId = v.sort.slice(0, -2)
          const parentObj =
            distObj$sort[tmpPId] || distObj$sort[(tmpPId = tmpPId.slice(0, -2))] || distObj$sort[tmpPId.slice(0, -2)]
          v._parentId = parentObj?.sort || undefined
        }
        v._id = v.sort
        v._sort = +v.sort
        return v
      })
      const tree = butils.listToTree({
        list: dictList,
        root: null,
        isDeepClone: false,
        props: {
          id: '_id',
          parentId: '_parentId',
          children: 'children',
          order: true,
          orderField: '_sort',
          orderBy: 'desc'
        }
      })

      console.log('distictClone', dictList, tree)
    </script>
  </body>
</html>
