      // 生成父子关系
      info2.forEach(v => {
        v._id = v?.key
        v._sort = parseInt(v.sort)
        if (v?.key?.length === 1) {
          // 长度等于1
          v._parentId = null
        } else if (v?.key?.length === 3) {
          // 长度等于3
          v._parentId = v?.key.at?.(0)
        } else if (v?.key?.length > 3) {
          // 长度大于3
          v._parentId = v?.key.slice(0, -1)
        }
      })

      const tree = butils.listToTree({
        list: info2,
        root: null,
        isDeepClone: false,
        props: {
          id: '_id',
          parentId: '_parentId',
          children: 'children',
          order: true,
          orderField: '_sort',
